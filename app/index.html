<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amazon Clone</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navbar -->
  <header>
    <div class="navbar">
      <div class="nav-logo border">
        <div class="logo">
          <img src="images/amazon_logo.png" alt="Amazon Logo" />
        </div>
      </div>
      <div class="nav-address border">
        <p class="add-first">Deliver to</p>
        <div class="add-icon">
          <i class="fa-solid fa-location-dot"></i>
          <p class="add-sec">India</p>
        </div>
      </div>
      <div class="nav-search">
        <select class="search-select">
          <option>All</option>
        </select>
        <input placeholder="Search Amazon" class="search-input" />
        <div class="search-icon">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
      </div>
      <div class="nav-signin border">
        <p><span>Hello, sign in</span></p>
        <p class="nav-second">Account & Lists</p>
      </div>
      <div class="nav-return border">
        <p><span>Returns</span></p>
        <p class="nav-second">& Orders</p>
      </div>
      <div class="nav-cart border">
        <i class="fa-solid fa-cart-shopping"></i>
        <p class="nav-second">Cart</p>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <div class="hero">
    <img src="images/hero_image.jpg" alt="Hero Banner" />
  </div>

  <!-- Products -->
  <div class="products">
    <div class="box"><img src="images/box1_image.jpg" alt="Box 1" /></div>
    <div class="box"><img src="images/box2_image.jpg" alt="Box 2" /></div>
    <div class="box"><img src="images/box3_image.jpg" alt="Box 3" /></div>
    <div class="box"><img src="images/box4_image.jpg" alt="Box 4" /></div>
    <div class="box"><img src="images/box5_image.jpg" alt="Box 5" /></div>
    <div class="box"><img src="images/box6_image.jpg" alt="Box 6" /></div>
    <div class="box"><img src="images/box7_image.jpg" alt="Box 7" /></div>
    <div class="box"><img src="images/box8_image.jpg" alt="Box 8" /></div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-top">Back to top</div>
    <div class="footer-links">
      <ul>
        <li><a href="#">Careers</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">About Amazon</a></li>
        <li><a href="#">Investor Relations</a></li>
      </ul>
    </div>
    <div class="footer-bottom">
      <img src="images/amazon_logo.png" alt="Amazon Logo" />
      <p>© 2026 Amazon Clone by Vivek</p>
    </div>
  </footer>
</body>
</html>
